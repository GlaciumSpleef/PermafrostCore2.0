name: PermafrostCore
main: io.paper.permafrost.Main
version: 1.0
api-version: 1.21
commands:
  spleef:
    description: teleports player to spleef arena, gives a shovel
    aliases: [s]  
  spawn:
    description: teleports player to spawn
    usage: /spawn
    aliases: [hub, leave, lobby, 1]
  msg:
    description: Send a private message
    usage: /msg <player> <message>
    aliases: [tell, w, whisper, pm, r]
  endgame:
    description: ends the current spleef game
    usage: /endgame
  spectate:
    description: spectates the given player
    usage: /spectate
    aliases: [watch]
  teams:
    description: send spleef duels with multiple people
    usage: /teams
  hover:
    description: click to accept duel
    usage: /hover
  teamlist:
    description: displays the teams in the current game
    usage: /teamlist
    aliases: [tl]
  playto:
    description: changes the score that the game is played to
    usage: /playto
  powers:
    description: select the powers you want to enhance your shovel with
    usage: /powers
  bans:
    description: select the powers you want to ban
    usage: /bans
  powerslist:
    description: displays the powers of the people that you are in game with
    usage: /powerslist
  matches:
    description: displays the current spleef games
    usage: /matches
  duelaccept:
    description: Accept a duel request
    usage: /duelaccept
  dueldeny:
    description: Deny a duel request
    usage: /dueldeny
  duelcancel:
    description: Cancel a duel request you sent
    usage: /duelcancel
  duel:
    description: Send a duel request for a 1v1
    usage: /duel
  invite:
    description: invite a player or accept their request to join your training session
    usage: /invite
  join:
    description: accept an invite or request to join a player's training session
    usage: /join
  endsession:
    description: end your training session
    usage: /endsession
  leave:
    description: leave the training session
    usage: /leave
  admin:
    description: Admin commands
    usage: /admin plot <create|edit>
    permission: permafrost.admin
    permission-message: "&cYou do not have permission to use admin commands."
  spleggqueue:
    description: join the splegg queue
    usage: /spleggqueue
  spleefqueue:
    description: join the spleef queue
    usage: /spleefqueue
  vote:
    description: vote for your favorite map in splegg ffa
    usage: /vote
  nvn:
    description: use to toggle night vision
    usage: /nvn
  fplayto:
    description: Force sets the score
    usage: /fendgame <player> <score>
  fendgame:
    description: Force ends any active game by target player
    usage: /fendgame <player>
  fstartgame:
    description: Force starts a game
    usage: /fstartgame
    permission: permafrost.fstartgame
    permission-message: "§cYou do not have permission to use this command."
  spawnall:
    description: Force all players in queues to spawn
    usage: /spawnall
  queues:
    description: Close/open queues
    usage: /queues <close|open>
  spectateffa:
    description: Spectate ongoing ffa matches
    usage: /spectateffa
  spleggstatsholo:
    description: Change or refresh the Splegg stats hologram
  stats:
    description: View your stats
    usage: /stats
  rankedqueue:
    description: Enter a ranked queue
    usage: /rankedqueue <spleef|splegg> <menu|powerspleef|airspleef|minispleef>
  cycleleaderboard:
    description: Cycles a leaderboard hologram
    usage: /cycleleaderboard <ffa1|ffa2|rankedsplegg|rankedspleef>
  ping:
    description: Displays your current ping or that of everyone
    usage: /ping
  shop:
    description: opens a preview of all ranks
    usage: /shop
  donationsholo:
    description: hologram click helper
    usage: /donationsholo
  ranks:
    description: opens a preview of all ranks you own and allows you to choose which you would like to display
    usage: /ranks
  shovels:
    description: opens a preview of all shovels you own and allows you to choose which you would like to display
    usage: /shovels
  favorites:
    description: opens a preview of maps so you can select your favorites
    usage: /favorites
  customrank:
    description: Manage custom ranks
    usage: /customrank
  fly:
    description: Toggle flight
    usage: /fly
  foundshovel:
    description: Marks an interactable shovel as found
    usage: /foundshovel
  ffaevent:
    description: Start an automated FFA Event
    usage: /ffaevent <powerspleef|airspleef|prototype> <points> <true|false>
  staffchat:
    description: Speak in staff chat
    usage: /staffchat
    aliases: [sc]
permissions:
  permafrost.admin:
    description: Full admin access to PermafrostCore
    default: false
  permafrost.staffchat:
    description: Access to speak and view staff chat
    default: false
  permafrostcore.fendgame:
    description: Allows force ending any game
    default: op
  permafrostcore.fstartgame:
    description: Allows force starting any game
    default: op
  permafrostcore.spawnall:
    description: Allows forcing players to spawn
    default: op
  permafrostcore.queues:
    description: Allows opening and closing queues
    default: op
  permafrostcore.ffaevent:
    description: Allows starting ffa events
    default: op
depend: [FancyHolograms, LuckPerms, ProtocolLib]